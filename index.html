<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17131C">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%AB%A7%3C/text%3E%3C/svg%3E">
<title>&#50504;&#45397;</title>
<meta name="description" content="Everything for all three papers, in the order you sit them.">
<style>

  /* The palette lives in the deck source, which this page does not include.
     Without it every var() is invalid, the portrait renders black and half
     the text disappears -- which is exactly what the first build did. Keep
     these in step with :root in build/backwards-trick.html. */
  :root{
    --ground:#FCF7F3; --raise:#FFFFFF; --raise2:#F6EEE8; --edge:#E9DCD2;
    --ink:#2A1F2E; --soft:#6E5F75; --faint:#9C8DA3;
    --peach:#C1502A; --mint:#14705C; --butter:#8A5A0B;
    --glow:rgba(193,80,42,.10); --shade:rgba(42,31,46,.07);
    --voice:Georgia,'Iowan Old Style','Times New Roman',serif;
    --ui:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
    --num:ui-monospace,'SF Mono','Cascadia Code',Consolas,'Roboto Mono',monospace;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ground); color:var(--ink);
    font-family:var(--ui); line-height:1.55;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:520px; margin:0 auto; padding:36px 20px 48px}

  /* ---- hero ---- */
  .hero{text-align:center; margin-bottom:34px}
  /* 4:5 portrait. Big enough to be a person rather than an avatar, small
     enough that the three subjects are still reachable on a phone screen
     without a long scroll -- which matters more here than the picture does. */
  .portrait{
    position:relative;
    width:210px; height:262px; margin:0 auto 22px;
    border-radius:26px; overflow:hidden; background:var(--raise2);
    box-shadow:0 0 0 5px var(--raise), 0 0 0 6px var(--edge),
               0 18px 40px var(--shade);
  }
  /* a warm bloom behind her, so the card is not a rectangle floating on cream */
  .portrait::after{
    content:''; position:absolute; inset:0; border-radius:26px; pointer-events:none;
    box-shadow:inset 0 -70px 60px -46px var(--glow);
  }
  .portrait svg,.portrait img{width:100%; height:100%; display:block; object-fit:cover}
  .eyebrow{
    font-family:var(--num); font-size:12px; letter-spacing:.24em;
    text-transform:uppercase; color:var(--peach); margin:0 0 8px;
  }
  h1{
    font-family:var(--voice); font-weight:400; font-size:34px; line-height:1.2;
    margin:0 0 12px; letter-spacing:-.01em;
  }
  .lede{
    font-family:var(--voice); font-size:17px; color:var(--soft);
    margin:0 auto; max-width:34ch;
  }

  /* ---- the optional question ---- */
  .ask{
    background:var(--raise); border:1px solid var(--edge); border-radius:20px;
    padding:20px 18px; margin-bottom:26px;
  }
  .asklabel{
    font-family:var(--num); font-size:11.5px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--faint); margin:0 0 13px;
  }
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{
    font:inherit; font-size:14.5px; cursor:pointer;
    background:var(--raise2); color:var(--soft);
    border:1px solid var(--edge); border-radius:999px; padding:9px 15px;
    -webkit-tap-highlight-color:transparent;
    transition:background .18s, color .18s, border-color .18s;
  }
  .chip:hover{border-color:var(--peach); color:var(--peach)}
  .chip.on{background:var(--peach); border-color:var(--peach); color:#fff}
  .reply{
    margin-top:15px; padding-top:15px; border-top:1px solid var(--edge);
    animation:fadein .34s ease-out both;
  }
  .reply p{
    font-family:var(--voice); font-size:16.5px; margin:0; color:var(--ink);
  }
  .replygo{
    display:inline-block; margin-top:12px; text-decoration:none;
    font-family:var(--num); font-size:12px; letter-spacing:.13em;
    text-transform:uppercase; color:var(--peach);
    border-bottom:1.5px solid var(--peach); padding-bottom:2px;
  }

  /* ---- the three ---- */
  .subjects{display:flex; flex-direction:column; gap:12px}
  .subj{
    display:flex; align-items:center; gap:14px; text-decoration:none;
    background:var(--raise); color:var(--ink);
    border:1px solid var(--edge); border-left:5px solid var(--edge);
    border-radius:18px; padding:16px 16px 16px 15px;
    -webkit-tap-highlight-color:transparent;
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s;
  }
  .subj:hover{transform:translateY(-2px); box-shadow:0 10px 26px var(--shade)}
  .subj:active{transform:translateY(0)}
  .tone-peach {border-left-color:var(--peach)}
  .tone-mint  {border-left-color:var(--mint)}
  .tone-butter{border-left-color:var(--butter)}
  .subj .ic{font-size:27px; line-height:1; flex:0 0 auto}
  .subj .mid{display:flex; flex-direction:column; gap:2px; min-width:0; flex:1 1 auto}
  .nm{font-family:var(--voice); font-size:20px; line-height:1.25}
  .code{
    font-family:var(--num); font-size:10.5px; letter-spacing:.12em;
    color:var(--faint); margin-left:8px; vertical-align:2px;
  }
  .when{
    font-family:var(--num); font-size:11px; letter-spacing:.05em;
    color:var(--peach); text-transform:uppercase; white-space:nowrap;
  }
  .tone-mint   .when{color:var(--mint)}
  .tone-butter .when{color:var(--butter)}
  .blurb{font-size:13.5px; color:var(--soft); margin-top:3px}
  .go{
    font-family:var(--num); font-size:11px; letter-spacing:.13em;
    text-transform:uppercase; color:var(--faint); flex:0 0 auto;
    border:1px solid var(--edge); border-radius:999px; padding:7px 11px;
  }
  .subj:hover .go{color:var(--peach); border-color:var(--peach)}
  .subj.now{box-shadow:0 0 0 3px var(--glow)}

  /* ---- foot ---- */
  .foot{margin-top:34px; text-align:center}
  .foot p{font-size:13.5px; color:var(--faint); margin:0 auto; max-width:36ch}
  .tiny{margin-top:10px !important; font-family:var(--num); font-size:11px;
        letter-spacing:.1em; text-transform:uppercase}

  /* ---- motion ---- */
  @keyframes fadein{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  .rise{animation:fadein .5s ease-out both}
  .hero .eyebrow{animation-delay:.04s}
  .hero h1{animation-delay:.10s}
  .hero .lede{animation-delay:.16s}
  .ask{animation-delay:.22s}
  .foot{animation-delay:.30s}
  @media (prefers-reduced-motion:reduce){
    .rise,.reply{animation:none}
    .subj{transition:none}
  }

  @media (max-width:380px){
    h1{font-size:29px}
    .subj .go{display:none}
  }

</style>
</head>
<body>

<div class="wrap">

  <header class="hero">
    <div class="portrait" id="portrait" aria-hidden="true">
      <!-- PORTRAIT SLOT: replace the <svg> below with
           <img src="data:image/jpeg;base64,..." alt="">
           and nothing else changes. The frame is 4:5 and crops with
           object-fit:cover from the centre, so the face wants to sit in the
           upper middle of whatever is supplied. -->
      <svg viewBox="0 0 80 100" role="img" aria-label="" preserveAspectRatio="xMidYMid slice">
        <rect width="80" height="100" fill="var(--raise2)"/>
        <circle cx="40" cy="38" r="15" fill="var(--edge)"/>
        <path d="M8 100 a32 27 0 0 1 64 0 Z" fill="var(--edge)"/>
      </svg>
    </div>

    <p class="eyebrow rise">&#50504;&#45397;</p>
    <h1 class="rise">It is me. Come in.</h1>
    <p class="lede rise">Three papers this week. All of it is here, in the
       order you sit them, and it keeps your place.</p>
  </header>

  <section class="ask rise" id="ask">
    <p class="asklabel">How is today going?</p>
    <div class="chips" id="chips"></div>
    <div class="reply" id="reply" hidden></div>
  </section>

  <nav class="subjects" id="subjects" aria-label="Choose a subject"></nav>

  <footer class="foot rise">
    <p>It remembers where you stopped, so you can close it any time. Nothing
       here is marked and nothing is counted.</p>
    <p class="tiny">Made for you. <span id="stamp"></span></p>
  </footer>

</div>

<script>
(function(){
  "use strict";

  /* ---- the three papers ------------------------------------------------ */
  var SUBJECTS = [
    { key:'maths',     file:'maths.html', name:'Maths',     code:'A115',
      icon:'\u{1F522}', day:17, tone:'peach',
      blurb:'Six moves, then every topic on the paper.' },
    { key:'biology',   file:'bio.html',   name:'Biology',   code:'A110',
      icon:'\u{1F9EC}', day:18, tone:'mint',
      blurb:'How the marks are split, then the questions worked.' },
    { key:'chemistry', file:'chem.html',  name:'Chemistry', code:'A105',
      icon:'\u{1F9EA}', day:20, tone:'butter',
      blurb:'Moles first. Everything else leans on it.' }
  ];
  var YEAR = 2026, MONTH = 7; /* August, zero-based */

  function daysUntil(day){
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var exam = new Date(YEAR, MONTH, day);
    return Math.round((exam - today) / 86400000);
  }

  function whenText(d){
    if(d < 0)  return 'sat already';
    if(d === 0) return 'today';
    if(d === 1) return 'tomorrow';
    return 'in ' + d + ' days';
  }

  /* Short forms deliberately: the full weekday and month wrapped the line in
     two on a 390px phone, which made every card 30px taller for no gain. */
  var WEEKDAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function dateText(day){
    var e = new Date(YEAR, MONTH, day);
    return WEEKDAY[e.getDay()] + ' ' + day + ' Aug';
  }

  /* Where she got to. Position only -- never a count, never a bar. */
  function place(key){
    try{
      var v = localStorage.getItem('eonni.pos.' + key + '.v1');
      return v && parseInt(v, 10) > 0;
    }catch(e){ return false; }
  }

  function card(s){
    var d = daysUntil(s.day);
    var been = place(s.key);
    var a = document.createElement('a');
    a.className = 'subj tone-' + s.tone + (d === 0 ? ' now' : '');
    a.href = s.file;
    a.innerHTML =
      '<span class="ic" aria-hidden="true">' + s.icon + '</span>' +
      '<span class="mid">' +
        '<span class="nm">' + s.name + '<span class="code">' + s.code + '</span></span>' +
        '<span class="when">' + dateText(s.day) + ' &#183; ' + whenText(d) + '</span>' +
        '<span class="blurb">' + s.blurb + '</span>' +
      '</span>' +
      '<span class="go">' + (been ? 'carry on' : 'open') + '</span>';
    return a;
  }

  var host = document.getElementById('subjects');
  SUBJECTS.forEach(function(s){ host.appendChild(card(s)); });

  /* ---- the optional question ------------------------------------------- */
  /* Never a gate. The subjects above are already tappable. One of these
     replies tells her to stop, which is what makes the other three worth
     reading. */
  var ANSWERS = [
    ['okay',
     'Good. Then take the one you sit first and do the opening few cards. ' +
     'Getting started is the whole trick; the rest follows on its own.',
     'maths'],
    ['a bit nervous',
     'That is normal and it says nothing about how it will go. Do one card. ' +
     'Not a topic, one card. Then decide whether you want another.',
     'maths'],
    ['no idea where to start',
     'Then I will pick. Maths, the very first card. It has no maths in it at ' +
     'all, which is deliberate.',
     'maths'],
    ['not today',
     'Then not today. Close this and go and do something else. Ten honest ' +
     'minutes tomorrow will beat an hour you spend dreading. It will all ' +
     'still be here.',
     null]
  ];

  var chips = document.getElementById('chips');
  var reply = document.getElementById('reply');
  ANSWERS.forEach(function(a){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = a[0];
    b.addEventListener('click', function(){
      [].forEach.call(chips.children, function(c){ c.classList.remove('on'); });
      b.classList.add('on');
      var go = '';
      if(a[2]){
        var s = SUBJECTS.filter(function(x){ return x.key === a[2]; })[0];
        go = '<a class="replygo" href="' + s.file + '">take me there</a>';
      }
      reply.innerHTML = '<p>' + a[1] + '</p>' + go;
      reply.hidden = false;
    });
    chips.appendChild(b);
  });

  /* a quiet line, not a countdown clock */
  var soonest = Math.min.apply(null, SUBJECTS.map(function(s){
    var d = daysUntil(s.day); return d < 0 ? 99 : d;
  }));
  document.getElementById('stamp').textContent =
    soonest === 99 ? 'all three sat.' :
    soonest === 0  ? 'first one is today.' :
    soonest === 1  ? 'first one is tomorrow.' :
                     'first one is in ' + soonest + ' days.';
})();
</script>

</body>
</html>
